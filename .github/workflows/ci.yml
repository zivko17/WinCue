# =============================================================================
#  CI de WinCue — build + suite completa en cada empujón
# =============================================================================
#  POR QUÉ EXISTE: hasta ahora lo único que protegía el proyecto era la
#  disciplina manual (build → test → smoke). Funciona mientras no haya un
#  despiste, y no sobrevive a un segundo par de manos. Esto es la red.
#
#  DÓNDE VIVE: en la RAÍZ del repo, no en WinCueSharp/. GitHub solo mira
#  .github/workflows del primer nivel; un workflow dentro de la subcarpeta se
#  ignora en silencio, que es la peor forma de no tener CI.
#
#  RUNNER: windows-latest obligatorio. El producto es net8.0-windows + WPF y no
#  compila en Linux; un runner ubuntu sería más barato y no serviría de nada.
#
#  LO QUE ESTE CI **NO** CUBRE (dicho aquí para que nadie lo confunda con una
#  garantía que no da):
#    - La media de prueba (.mov/.mp4) y las DLL nativas (ffmpeg-lgpl\bin,
#      libmpv-lgpl) NO están versionadas. Los tests que dependen de ellas se
#      autoexcluyen y salen VERDES SIN EJECUTAR su parte nativa. Verificado
#      clonando el repo en limpio: 753 tests pasan sin una sola de esas piezas.
#    - El smoke (--smoke) no se ejecuta: abre una ventana WPF y necesita libmpv.
#    - El guardián de licencias de publish.ps1 tampoco: necesita esas DLL.
#    Traducido: esto protege la LÓGICA (motor, controlador, JSON, audio), no la
#    capa que el operador toca ni las rutas nativas. Eso lo sigue viendo Andrés
#    en pantalla.
# =============================================================================
name: CI

on:
  push:
    # secuence/**: la rama de Secuence vive fuera de pruebas-v2 hasta que se
    # integre; sin esta entrada, sus empujones no ejecutaban el CI.
    branches: [pruebas-v2, main, 'secuence/**']
    paths:
      - 'WinCueSharp/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [pruebas-v2, main]
    paths:
      - 'WinCueSharp/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

# Empujones seguidos a la misma rama: cancela el anterior. El repo es privado y
# los runners de Windows gastan minutos al DOBLE que los de Linux.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-y-tests:
    name: Build + tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      # El hito 1 dejó 94 nombres duplicados entre Theme.cs (WPF) y Palette.cs
      # (sin framework, para que Secuence la comparta): la correspondencia es
      # por NOMBRE y el compilador no la vigila. Un cruce compila, pasa la
      # suite entera y pinta mal en un escenario. Va aquí, antes del build,
      # porque es puramente textual — no necesita el SDK ni compilar nada — y
      # así falla rápido si el cruce ya está ahí, sin gastar el resto del job.
      - name: Verificar que Theme sigue derivando de Palette
        shell: pwsh
        run: WinCueSharp/scripts/verificar-paleta.ps1

      # La versión se lee de global.json y NO se escribe aquí: si estuviera en
      # los dos sitios, acabarían discrepando. Ojo, esto instala el SDK pero no
      # impide que la imagen del runner traiga otros más nuevos — quien decide
      # cuál se usa es global.json. Sin él, el runner compilaba con .NET 10
      # mientras en local se compilaba con 8.0, y con AnalysisLevel=latest-all
      # eso significa analizadores distintos: 60+ errores que aquí no salían.
      - name: Instalar .NET (según global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Deja constancia en el log de con qué SDK se compila de verdad. Si algún
      # día vuelve a divergir, se ve en dos líneas en vez de en media hora.
      - name: SDK en uso
        run: |
          dotnet --version
          dotnet --list-sdks

      - name: Restaurar
        run: dotnet restore WinCueSharp/WinCueSharp.sln

      # Secuence.App (WinUI 3) necesita las tareas Appx de Visual Studio
      # (MrtCore.PriGen.targets → ExpandPriContent): `dotnet build` no las
      # trae, y el autorresuelto del .csproj solo sondea las rutas clásicas de
      # VS 2022 — la imagen del runner mueve Visual Studio de sitio sin avisar
      # (así se cayó el primer build de Secuence aquí: ninguna sonda casó y
      # MSBuild cayó a una ruta bajo el SDK de dotnet que no existe). vswhere
      # es la herramienta OFICIAL para encontrar VS: se busca AppxPackage en
      # cada instalación (v17, v18, la que haya) y se exporta como variable de
      # entorno — MSBuild trata el entorno como propiedad, y la condición
      # '$(AppxMSBuildToolsPath)' == '' del .csproj deja ganar este valor.
      - name: Localizar las tareas Appx de Visual Studio (Secuence.App)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $roots = @(& $vswhere -products * -requires Microsoft.Component.MSBuild -property installationPath)
          $appx = $roots |
            ForEach-Object { Get-ChildItem -Path (Join-Path $_ 'MSBuild\Microsoft\VisualStudio') -Directory -Filter 'v*' -ErrorAction SilentlyContinue } |
            ForEach-Object { Join-Path $_.FullName 'AppxPackage' } |
            Where-Object { Test-Path (Join-Path $_ 'Microsoft.Build.Packaging.Pri.Tasks.dll') } |
            Select-Object -First 1
          if (-not $appx) {
            # Último recurso: la DLL puede vivir fuera del árbol MSBuild clásico
            $hit = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio' -Recurse -Filter 'Microsoft.Build.Packaging.Pri.Tasks.dll' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($hit) { $appx = $hit.DirectoryName }
          }
          if (-not $appx) { throw 'Sin AppxPackage en ninguna instalacion de Visual Studio del runner: Secuence.App no puede compilar aqui.' }
          "AppxMSBuildToolsPath=$appx\" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "AppxMSBuildToolsPath=$appx\"

      # TreatWarningsAsErrors se fuerza AQUÍ y no en Directory.Build.props: en
      # local sigue en false para no interrumpir mientras se trabaja, pero nada
      # entra en la rama con un warning. Comprobado que hoy compila a cero.
      - name: Compilar (Release, warnings = errores)
        run: >
          dotnet build WinCueSharp/WinCueSharp.sln
          -c Release --no-restore
          -p:TreatWarningsAsErrors=true

      # --filter "Requiere!=libmpv": excluye el canario que comprueba que
      # libmpv-2.dll se carga en la máquina. Aquí no existe (98 MB, no se
      # versiona), así que fallaría siempre. Se excluye A LA VISTA y no con un
      # `return` dentro del test: su valor está justamente en fallar a gritos en
      # la máquina de desarrollo si la DLL desaparece.
      - name: Tests
        run: >
          dotnet test WinCueSharp/WinCueSharp.sln
          -c Release --no-build
          --filter "Requiere!=libmpv"
          --logger "trx;LogFileName=tests.trx"
          --results-directory "${{ github.workspace }}/resultados"

      - name: Guardar los resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-tests
          path: resultados/
          retention-days: 14
